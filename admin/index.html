<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유바미 관리자</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><div class="shell nav"><a class="brand" href="../index.html"><i>🛠️</i><span><small>PRIVATE ADMIN</small>유바미 관리자</span></a><a class="btn soft" href="../index.html">일반 사이트</a></div></header><main><div class="shell"><section id="loginView" class="card login"><div class="kicker">ADMIN LOGIN</div><h1 class="page-title" style="font-size:40px">관리자 로그인</h1><form id="loginForm" class="form"><label>이메일<input class="field" id="email" type="email" required></label><label>비밀번호<input class="field" id="password" type="password" required></label><button class="btn primary">로그인</button><p id="loginStatus"></p></form></section><section id="adminView" class="hidden"><h1 class="page-title">사이트 관리</h1><p><span id="adminEmail"></span> · <button class="btn soft" id="logout">로그아웃</button></p><div class="admin-grid"><aside class="card side"><button class="active" data-panel="songs">🎵 노래</button><button data-panel="notices">📢 공지</button><button data-panel="schedules">📅 일정</button><button data-panel="wardrobe">👗 옷장</button><button data-panel="instagram">📷 바미스타그램</button><button data-panel="curiosity">📚 호기심 노트</button></aside><section class="card pad"><div class="panel active" id="panel-songs"><h2>노래 관리</h2><form class="form content-form" data-collection="songs"><input type="hidden" name="_id"><div class="form-grid"><label>가수<input class="field" name="artist" required></label><label>제목<input class="field" name="title" required></label><label>난이도<select class="field" name="difficulty"><option value="1">★☆☆☆☆</option><option value="2">★★☆☆☆</option><option value="3">★★★☆☆</option><option value="4">★★★★☆</option><option value="5">★★★★★</option></select></label><label>태그<input class="field" name="tags"></label></div><div class="actions"><button class="btn primary" data-submit>저장</button><button type="button" class="btn ghost hidden" data-cancel>수정 취소</button></div></form><div class="manage" data-list="songs"></div></div><div class="panel" id="panel-notices"><h2>공지 관리</h2><form class="form content-form" data-collection="notices"><input type="hidden" name="_id"><label>제목<input class="field" name="title" required></label><label>내용<textarea class="field" name="content"></textarea></label><div class="actions"><button class="btn primary" data-submit>저장</button><button type="button" class="btn ghost hidden" data-cancel>수정 취소</button></div></form><div class="manage" data-list="notices"></div></div><div class="panel" id="panel-schedules"><h2>일정 관리</h2><form class="form content-form" data-collection="schedules"><input type="hidden" name="_id"><label>제목<input class="field" name="title" required></label><label>날짜<input class="field" type="date" name="date"></label><label>시간<input class="field" type="time" name="time"></label><label>내용<textarea class="field" name="content"></textarea></label><div class="actions"><button class="btn primary" data-submit>저장</button><button type="button" class="btn ghost hidden" data-cancel>수정 취소</button></div></form><div class="manage" data-list="schedules"></div></div><div class="panel" id="panel-wardrobe"><h2>옷장 관리</h2><form class="form content-form" data-collection="wardrobe"><input type="hidden" name="_id"><label>제목<input class="field" name="title" required></label><label>내용<textarea class="field" name="content"></textarea></label><label>이미지 URL<input class="field" name="imageUrl"></label><div class="actions"><button class="btn primary" data-submit>저장</button><button type="button" class="btn ghost hidden" data-cancel>수정 취소</button></div></form><div class="manage" data-list="wardrobe"></div></div><div class="panel" id="panel-instagram"><h2>바미스타그램 관리</h2><form class="form content-form" data-collection="instagram"><input type="hidden" name="_id"><label>제목<input class="field" name="title" required></label><label>내용<textarea class="field" name="content"></textarea></label><label>이미지 URL<input class="field" name="imageUrl"></label><div class="actions"><button class="btn primary" data-submit>저장</button><button type="button" class="btn ghost hidden" data-cancel>수정 취소</button></div></form><div class="manage" data-list="instagram"></div></div><div class="panel" id="panel-curiosity"><h2>호기심 노트 관리</h2><form class="form content-form" data-collection="curiosity"><input type="hidden" name="_id"><label>제목<input class="field" name="title" required></label><label>내용<textarea class="field" name="content"></textarea></label><div class="actions"><button class="btn primary" data-submit>저장</button><button type="button" class="btn ghost hidden" data-cancel>수정 취소</button></div></form><div class="manage" data-list="curiosity"></div></div></section></div></section></div></main><script type="module" src="admin.js"></script></body></html>
